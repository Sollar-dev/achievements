events {}

http {
    upstream app_server {
        server app:8000;
    }

    server {
        listen 80;

        location = /increment {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # всё остальное наружу не отдаем
        location / {
            return 404;
        }
    }
}
