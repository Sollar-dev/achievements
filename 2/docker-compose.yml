services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: numbers
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U app -d numbers"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/numbers
      MAX_N: "1000000"
      LOG_FILE: /app/logs/app.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
